name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  linux-kernel-nftables:
    # Applies the REAL ruleset in an isolated network namespace (never touches the runner's network).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nftables
          python -m pip install -e .
      - name: Real-kernel nftables tests (isolated netns)
        run: sudo unshare --net env PHANTOMX_NFT_KERNEL=1 PYTHONPATH="$PWD" "$(which python)" -m unittest tests.test_nft_kernel -v
